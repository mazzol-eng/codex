services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_USER: bothub
      POSTGRES_PASSWORD: bothub_local
      POSTGRES_DB: bothub
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bothub -d bothub']
      interval: 2s
      timeout: 5s
      retries: 20
  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  redis_data:
